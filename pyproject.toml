[project]
name = "fluxed-up-multiplatform"
version = "0.1.0"
description = "fluxed-up-multiplatform is an opinionated Python framework to work with various chat applications."
readme = "README.rst"
requires-python = ">=3.14"
license = "MIT"
keywords = [
    "fluxer", "discord", "api"
]
import-namespaces = [
    "fluxed_up"
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed"
]

dependencies = [
    "aiohttp>=3.14.5",
    "python-dotenv>=1.2.4",
]

[project.urls]
source = "https://github.com/FishingBucket/fluxed-up-multiplatform"

[dependency-groups]
dev = [
    "aioresponses-ng>=0.8.2",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.4",
    "sphinx>=9.2.0",
]

[tool.ruff]
target-version = "py314"

[tool.ruff.format]
line-ending = "lf"
docstring-code-format = true

[tool.mypy]
modules = "fluxed_up"
follow_untyped_imports = true
disallow_any_decorated = true
disallow_any_explicit = true
check_untyped_defs = true
implicit_optional = true
allow_redefinition = true
strict_equality = true
strict = true
no_redef = false
exclude = ["docs"]
